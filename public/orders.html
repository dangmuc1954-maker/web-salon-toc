<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Lý Đơn Đặt Lịch & Order Tư Vấn - Máy Chủ Salon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .orders-table-wrap {
      display: grid;
      gap: 16px;
      margin-top: 20px;
    }
    .order-item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.3fr 1.1fr 0.9fr;
      gap: 20px;
      align-items: center;
    }
    .status-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-new {
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold-light);
      border: 1px solid var(--gold-primary);
    }
    .status-contacted {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
    }
    .status-done {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }
    @media (max-width: 900px) {
      .order-item-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/" class="brand">
        <div class="brand-icon">✂</div>
        <div>
          <div class="brand-title">QUẢN LÝ ĐƠN ĐẶT LỊCH SALON</div>
          <div class="brand-sub">Danh sách đơn khách gửi về máy chủ</div>
        </div>
      </a>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-outline btn-sm" onclick="loadOrders()">🔄 Làm Mới Đơn</button>
        <a href="/" class="btn btn-gold btn-sm">⬅ Về Trang Chủ Khách Hàng</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="filter-toolbar">
        <div>
          <h2 class="section-title">Tất Cả Đơn Đặt Lịch & Order Nhân Viên Tư Vấn</h2>
          <p class="section-sub">Tự động cập nhật từ máy chủ (`data/orders.json`). Bấm gọi khách hoặc nhắn Zalo cho nhân viên phụ trách.</p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <select id="staffFilter" class="form-control" style="width:auto;" onchange="renderOrdersList()">
            <option value="">-- Tất cả nhân viên --</option>
          </select>
          <input type="text" id="orderSearch" class="inline-search" placeholder="🔎 Tìm tên khách, SĐT, mã đơn..." oninput="renderOrdersList()" />
        </div>
      </div>

      <div id="ordersList" class="orders-table-wrap"></div>
    </div>
  </main>

  <script>
    let ALL_ORDERS = [];

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadOrders() {
      const res = await fetch("/api/orders");
      const data = await res.json();
      ALL_ORDERS = data.orders || [];

      const staffNames = [...new Set(ALL_ORDERS.map(o => o.staff && o.staff.name).filter(Boolean))];
      const staffFilter = document.getElementById("staffFilter");
      const currentVal = staffFilter.value;
      staffFilter.innerHTML = `<option value="">-- Tất cả nhân viên (${ALL_ORDERS.length} đơn) --</option>` +
        staffNames.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("");
      staffFilter.value = currentVal;

      renderOrdersList();
    }

    function renderOrdersList() {
      const staffName = document.getElementById("staffFilter").value;
      const q = document.getElementById("orderSearch").value.toLowerCase().trim();
      const wrap = document.getElementById("ordersList");

      const filtered = ALL_ORDERS.filter(o => {
        const matchStaff = !staffName || (o.staff && o.staff.name === staffName);
        const matchQ = !q ||
          (o.customerName || "").toLowerCase().includes(q) ||
          (o.customerPhone || "").toLowerCase().includes(q) ||
          (o.orderCode || "").toLowerCase().includes(q);
        return matchStaff && matchQ;
      });

      if (filtered.length === 0) {
        wrap.innerHTML = `<div style="padding:36px; text-align:center; background:var(--bg-card); border-radius:16px; color:var(--text-muted);">Chưa có đơn đặt lịch nào.</div>`;
        return;
      }

      wrap.innerHTML = filtered.map(o => {
        const st = o.staff || {};
        const srvNames = (o.selectedServices || []).map(s => `${s.name} (${s.priceDisplay})`).join(", ") || "Nhờ nhân viên tư vấn";
        const statusClass = o.status === "Hoàn thành" ? "status-done" : (o.status === "Đã liên hệ" ? "status-contacted" : "status-new");

        return `
          <div class="order-item-card">
            <div>
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                <span class="status-pill ${statusClass}">${escapeHtml(o.status || "Mới tiếp nhận")}</span>
                <strong style="color:var(--gold-light);">${escapeHtml(o.orderCode)}</strong>
                <span style="font-size:12px; color:var(--text-dim);">• ${o.orderType === "consult" ? "💬 Order Tư Vấn" : "📅 Đặt Lịch"}</span>
              </div>
              <div style="font-size:18px; font-weight:800; margin-bottom:4px;">
                👤 Khách: ${escapeHtml(o.customerName)} — <a href="tel:${escapeHtml(o.customerPhone)}" style="color:var(--gold-light);">📞 ${escapeHtml(o.customerPhone)}</a>
              </div>
              <div style="font-size:13.5px; color:var(--text-muted);">
                🕒 Hẹn: <strong>${escapeHtml(o.appointmentDate || "Hôm nay")} - ${escapeHtml(o.appointmentTime || "Sớm nhất")}</strong>
              </div>
              ${o.selectedHairstyle ? `<div style="font-size:13px; margin-top:4px;">💇‍♀️ Mẫu tóc: <strong>${escapeHtml(o.selectedHairstyle.name)}</strong></div>` : ""}
              ${o.selectedColor ? `<div style="font-size:13px;">🎨 Màu nhuộm: <strong>${escapeHtml(o.selectedColor.name)} (${escapeHtml(o.selectedColor.code)})</strong></div>` : ""}
              <div style="font-size:13px;">📋 Dịch vụ: ${escapeHtml(srvNames)}</div>
              ${o.note ? `<div style="font-size:13px; color:#f3dc8a; margin-top:4px;">📝 Ghi chú: "${escapeHtml(o.note)}"</div>` : ""}
            </div>

            <div style="background:rgba(0,0,0,0.35); padding:14px; border-radius:12px; border:1px solid var(--border-subtle);">
              <div style="font-size:11px; color:var(--gold-primary); font-weight:700; text-transform:uppercase; margin-bottom:6px;">
                ✂ NHÂN VIÊN KHÁCH ĐÃ CHỌN
              </div>
              <div style="font-weight:800; font-size:16px;">${escapeHtml(st.name || "")}</div>
              <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:6px;">${escapeHtml(st.role || "")}</div>
              <div style="font-size:14px; color:var(--gold-light); font-weight:700;">📲 SĐT Nhân viên: ${escapeHtml(st.phone || "")}</div>
            </div>

            <div style="display:flex; flex-direction:column; gap:8px;">
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <a href="tel:${escapeHtml(o.customerPhone)}" class="btn btn-call btn-sm">📞 Gọi Khách</a>
                <a href="https://zalo.me/${escapeHtml((o.customerPhone || "").replace(/\D/g, ""))}" target="_blank" class="btn btn-zalo btn-sm">💬 Zalo Khách</a>
              </div>
              <select class="form-control" style="padding:7px 10px; font-size:13px;" onchange="updateStatus('${o.id}', this.value)">
                <option value="Mới tiếp nhận" ${o.status === "Mới tiếp nhận" ? "selected" : ""}>Trạng thái: Mới tiếp nhận</option>
                <option value="Đã liên hệ" ${o.status === "Đã liên hệ" ? "selected" : ""}>Trạng thái: Đã liên hệ</option>
                <option value="Hoàn thành" ${o.status === "Hoàn thành" ? "selected" : ""}>Trạng thái: Hoàn thành</option>
              </select>
              <button type="button" class="btn btn-outline btn-sm" style="color:#f87171; border-color:rgba(248,113,113,0.3);" onclick="deleteOrder('${o.id}')">🗑 Xóa Đơn</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function updateStatus(id, status) {
      await fetch("/api/orders/" + encodeURIComponent(id), {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });
      await loadOrders();
    }

    async function deleteOrder(id) {
      if (!confirm("Bạn chắc chắn muốn xóa đơn đặt lịch này?")) return;
      await fetch("/api/orders/" + encodeURIComponent(id), { method: "DELETE" });
      await loadOrders();
    }

    loadOrders();
    setInterval(loadOrders, 15000);
  </script>
</body>
</html>
